name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (macOS 26, Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          current="$(xcodebuild -version)"
          if [[ "$current" != "Xcode 26"* ]]; then
            xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
            echo "Switching to $xcode"
            sudo xcode-select -s "$xcode"
          fi
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version

      - name: Check caption path stays offline
        run: make check-offline

      - name: Self-test the offline check
        run: scripts/check-offline-selftest.sh

      - name: Core tests
        run: make test

      - name: Build, verify and package app
        run: make package

      - name: Upload app artifact
        uses: actions/upload-artifact@v6
        with:
          name: LiveCaptions-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/LiveCaptions.zip
          if-no-files-found: error
          retention-days: 14

      - name: Render overlay screenshots
        timeout-minutes: 3
        run: make screenshots

      - name: Upload overlay screenshots
        uses: actions/upload-artifact@v6
        with:
          name: overlay-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
