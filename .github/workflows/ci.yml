name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: Core is pure Swift and its tests run on Linux in about a
  # minute. The macOS job below stays the gate for everything else.
  core-linux:
    name: Core tests (Linux, Swift 6.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.3
    steps:
      - uses: actions/checkout@v5

      - name: Core tests
        run: |
          swift --version
          swift test --package-path Packages/Core

  build-and-test:
    name: Build and test (macOS 26, Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Pinned, not "the newest Xcode_26*": the image's set changes with
      # runner updates (docs/DECISIONS.md 0019). Missing means fail, so a
      # bump is a reviewed change to this line.
      - name: Select Xcode 26.6
        run: |
          xcode=/Applications/Xcode_26.6.app
          if [[ ! -d "$xcode" ]]; then
            echo "Installed Xcode versions:"
            ls -d /Applications/Xcode*.app || true
            echo "error: $xcode is missing on this runner image" >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
          sw_vers
          xcbeautify --version

      - name: Install XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version

      - name: Check Swift formatting
        run: make format-check

      - name: Check caption path stays offline
        run: make check-offline

      - name: Self-test the offline checks
        run: scripts/check-offline-selftest.sh

      - name: Core tests
        run: make test

      - name: Self-test the app verifier
        run: scripts/verify-app-selftest.sh

      # Also fails if project.yml's version has no CHANGELOG.md section.
      - name: Self-test the release checks
        run: scripts/release-selftest.sh

      # make build pipes xcodebuild into xcbeautify; prove that a failing
      # xcodebuild still fails the target (pipefail).
      - name: Self-test that a failing build fails through the log filter
        run: |
          if make build XCODEBUILD=false XCBEAUTIFY="xcbeautify --renderer github-actions"; then
            echo "error: make build passed although xcodebuild failed" >&2
            exit 1
          fi
          echo "ok: a failing xcodebuild fails make build"

      # Warnings are errors here (SWIFT_TREAT_WARNINGS_AS_ERRORS in the
      # Makefile; the packages set it in Package.swift).
      - name: Build, verify and package app
        run: make package WARNINGS_AS_ERRORS=YES XCBEAUTIFY="xcbeautify --renderer github-actions"

      - name: Check linked frameworks stay offline
        run: make check-linked-frameworks

      - name: Upload app artifact
        uses: actions/upload-artifact@v6
        with:
          name: LiveCaptions-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/LiveCaptions.zip
          if-no-files-found: error
          retention-days: 14

      - name: Render screenshots (overlay, menu, Settings, welcome)
        timeout-minutes: 3
        run: make screenshots

      # Overlay renders were byte-identical across runners; a change beyond
      # the tolerance fails here (docs/TESTING.md, "Reference images").
      - name: Self-test the screenshot compare
        timeout-minutes: 3
        run: scripts/compare-screenshots-selftest.sh

      - name: Compare overlay screenshots with the references
        timeout-minutes: 3
        run: make compare-screenshots

      - name: Upload rendered screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: overlay-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      # The runner agent holds Screen Recording, so screencapture from a step
      # sees the app's windows (docs/TESTING.md, "Screenshots from CI").
      # The runner's desktop is black, like the overlay pill; a grey one
      # makes the pill's outline visible.
      - name: Use a grey desktop picture
        timeout-minutes: 2
        run: |
          picture="/System/Library/Desktop Pictures/Solid Colors/Silver.png"
          if [[ ! -f "$picture" ]]; then
            ls "/System/Library/Desktop Pictures/Solid Colors/"
            echo "error: $picture is missing" >&2
            exit 1
          fi
          osascript -e "tell application \"System Events\" to tell every desktop to set picture to POSIX file \"$picture\""

      - name: Screenshot the running app with demo captions
        timeout-minutes: 5
        run: make live-screenshots

      - name: Upload live screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: live-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/live-screenshots/
          if-no-files-found: error
          retention-days: 14
