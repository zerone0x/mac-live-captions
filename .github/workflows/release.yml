name: Release

# A tag v<major>.<minor>.<patch> on main builds, checks and publishes a GitHub
# Release with a drag-to-Applications DMG and the zipped app, each with its
# SHA-256 file, and the one-line installer install.sh (docs/DECISIONS.md
# 0023, 0026, 0027). PRs and manual runs upload artifacts without publishing.
# Only release tags and opt-in manual runs from main use Apple credentials.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-*
      - scripts/install*
      - CHANGELOG.md
      - project.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to check the version against (default v<MARKETING_VERSION>). Dry run, nothing is published.
        required: false
        default: ''
      signed:
        description: Sign and notarize the dry run (main only). Nothing is published.
        type: boolean
        default: false
      resume_app_submissions:
        description: Comma-separated Apple submission IDs for the same App. Reuse their ticket.
        type: string
        default: ''
      resume_app_cdhash:
        description: Expected signed App CDHash when resuming an existing submission.
        type: string
        default: ''
      resume_from_run:
        description: Optional original Release run ID for its verified unsigned App artifact.
        type: string
        default: ''

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  # Never cancel a running publish; a second run for the same ref waits.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package (macOS 26, Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      signed: ${{ steps.version.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and main, to check that a release tag is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide the tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SIGNED_DRY_RUN: ${{ inputs.signed }}
          RESUME_APP: ${{ inputs.resume_app_submissions }}
          RESUME_CDHASH: ${{ inputs.resume_app_cdhash }}
          RESUME_FROM_RUN: ${{ inputs.resume_from_run }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push ]]; then
            [[ "$REF_TYPE" == tag ]] || { echo "error: push of $REF_TYPE $REF_NAME is not a tag" >&2; exit 1; }
            tag="$REF_NAME"
          elif [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$INPUT_TAG"
          else
            # Dry run: check against the version the project says it is.
            marketing="$(sed -nE 's/^[[:space:]]+MARKETING_VERSION:[[:space:]]*"?([^"[:space:]#]*)"?.*$/\1/p' project.yml)"
            [[ -n "$marketing" ]] || { echo "error: no MARKETING_VERSION in project.yml" >&2; exit 1; }
            tag="v$marketing"
          fi
          # Fails unless the tag is v<major>.<minor>.<patch> and equals
          # project.yml's MARKETING_VERSION.
          version="$(scripts/release-version.sh "$tag")"
          signed=false
          if [[ "$EVENT" == push ]]; then
            signed=true
          elif [[ "$EVENT" == workflow_dispatch && "$SIGNED_DRY_RUN" == true ]]; then
            [[ "$REF_TYPE" == branch && "$REF_NAME" == main ]] \
              || { echo "error: signed dry runs must use main" >&2; exit 1; }
            signed=true
          fi
          if [[ -n "${RESUME_APP}${RESUME_CDHASH}${RESUME_FROM_RUN}" ]]; then
            [[ "$EVENT" == workflow_dispatch && "$signed" == true && -n "$RESUME_APP" && "$RESUME_CDHASH" =~ ^[0-9a-f]{40}$ ]] \
              || { echo 'error: resuming needs a signed dry run, submission IDs, and an App CDHash' >&2; exit 1; }
            [[ -z "$RESUME_FROM_RUN" || "$RESUME_FROM_RUN" =~ ^[0-9]+$ ]] \
              || { echo 'error: invalid original run ID' >&2; exit 1; }
          fi
          printf '%s\n' "tag=$tag" "version=$version" "signed=$signed" >>"$GITHUB_OUTPUT"
          echo "Release $tag (version $version), event $EVENT"

      - name: Check the tag is on main
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "error: tag $TAG ($commit) is not on main; release only merged, CI-tested commits" >&2
            exit 1
          fi
          echo "ok: $TAG ($commit) is on main"

      # Same pin as ci.yml (docs/DECISIONS.md 0019).
      - name: Select Xcode 26.6
        run: |
          xcode=/Applications/Xcode_26.6.app
          if [[ ! -d "$xcode" ]]; then
            echo "Installed Xcode versions:"
            ls -d /Applications/Xcode*.app || true
            echo "error: $xcode is missing on this runner image" >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version

      - name: Self-test the release checks
        run: scripts/release-selftest.sh

      - name: Self-test the app verifier
        run: scripts/verify-app-selftest.sh

      - name: Self-test the one-line installer
        timeout-minutes: 5
        run: scripts/install-selftest.sh

      - name: Check caption path stays offline
        run: make check-offline

      - name: Package tests
        run: make test

      # make package = Release build (warnings are errors), then
      # scripts/verify-app.sh: hardened runtime, exactly the audio-input
      # entitlement (no get-task-allow), stripped, arm64.
      - name: Build and verify Release app
        run: make package CONFIG=Release WARNINGS_AS_ERRORS=YES XCBEAUTIFY="xcbeautify --renderer github-actions"

      - name: Check linked frameworks stay offline
        run: make check-linked-frameworks

      - name: Check the built app's version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: scripts/release-version.sh "$TAG" build/DerivedData/Build/Products/Release/LiveCaptions.app

      # Zips with ditto, writes the .sha256 file, then unzips and re-runs
      # verify-app, check-linked-frameworks and the version check on what a
      # user gets.
      - name: Zip and checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-package.sh "$VERSION" build/DerivedData/Build/Products/Release/LiveCaptions.app dist

      - name: Pass the verified app to the signing job
        if: steps.version.outputs.signed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-${{ steps.version.outputs.tag }}
          path: |
            dist/LiveCaptions-${{ steps.version.outputs.version }}.zip
            dist/LiveCaptions-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

      # Builds LiveCaptions-<version>-mac-arm64.dmg with dmgbuild (pinned,
      # hash-checked, CI-only), writes its .sha256 file, then mounts it
      # read-only and checks the volume name, the Applications link, the
      # Finder layout and the volume icon, and re-runs verify-app,
      # check-linked-frameworks and the version check on the app inside.
      - name: Build and check the DMG
        if: steps.version.outputs.signed != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-dmg.sh "$VERSION" build/DerivedData/Build/Products/Release/LiveCaptions.app dist

      # The one-line installer (docs/DECISIONS.md 0027) installs the zip just
      # built, served from a local fake release, into a temporary folder with
      # macOS's /bin/bash; then the app's signature and version are checked.
      - name: Install the built zip with install.sh
        if: steps.version.outputs.signed != 'true'
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/install-selftest.sh "$VERSION" dist
          cp scripts/install.sh dist/install.sh

      # A picture of the window a user sees when opening the DMG, for review
      # only: not a check (the layout is checked above from the .DS_Store),
      # so it may fail without failing the release.
      - name: Screenshot the DMG window (preview, not a check)
        if: steps.version.outputs.signed != 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dmg="dist/LiveCaptions-$VERSION-mac-arm64.dmg"
          mnt="/Volumes/LiveCaptions $VERSION"
          mkdir -p build/dmg-preview
          trap 'scripts/with-timeout.sh 60 hdiutil detach -force -quiet "$mnt" || true' EXIT
          scripts/with-timeout.sh 120 hdiutil attach -readonly -noverify "$dmg" >/dev/null
          open "$mnt"
          sleep 5
          screencapture -x build/dmg-preview/dmg-window.png
          osascript -e "tell application \"Finder\" to close every window" || true

      - name: Upload the DMG window screenshot
        if: always() && steps.version.outputs.signed == 'false'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: dmg-preview-${{ steps.version.outputs.tag }}
          path: build/dmg-preview/
          if-no-files-found: warn
          retention-days: 14

      - name: Write release notes
        if: steps.version.outputs.signed != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scripts/release-notes.sh "$VERSION" \
            "dist/LiveCaptions-$VERSION.zip.sha256" \
            "dist/LiveCaptions-$VERSION-mac-arm64.dmg.sha256" >dist/release-notes.md
          {
            echo "## Release notes for v$VERSION (event: $EVENT)"
            echo
            cat dist/release-notes.md
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload release files
        if: steps.version.outputs.signed != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: |
            dist/LiveCaptions-${{ steps.version.outputs.version }}-mac-arm64.dmg
            dist/LiveCaptions-${{ steps.version.outputs.version }}-mac-arm64.dmg.sha256
            dist/LiveCaptions-${{ steps.version.outputs.version }}.zip
            dist/LiveCaptions-${{ steps.version.outputs.version }}.zip.sha256
            dist/install.sh
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign and notarize (macOS)
    needs: build
    if: >-
      needs.build.outputs.signed == 'true' &&
      ((github.event_name == 'push' && github.ref_type == 'tag') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.signed))
    environment: macos-release
    runs-on: macos-26
    # A resumed App submission may wait for four hours, then the DMG for 90 minutes.
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download the verified app
        uses: actions/download-artifact@v7
        with:
          name: unsigned-${{ needs.build.outputs.tag }}
          path: unsigned
          github-token: ${{ inputs.resume_from_run && github.token || '' }}
          run-id: ${{ inputs.resume_from_run || github.run_id }}

      - name: Sign and notarize the app and DMG
        env:
          APPLE_SIGNING_P12_BASE64: ${{ secrets.APPLE_SIGNING_P12_BASE64 }}
          APPLE_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: '4367F9SNJJ'
          RESUME_APP_SUBMISSIONS: ${{ inputs.resume_app_submissions }}
          RESUME_APP_CDHASH: ${{ inputs.resume_app_cdhash }}
        run: scripts/release-sign.sh "$VERSION" unsigned dist

      - name: Preserve the submitted DMG if the resumed run fails
        if: failure() && inputs.resume_app_submissions && hashFiles('dist/dmg-notary-id.txt') != ''
        uses: actions/upload-artifact@v6
        with:
          name: pending-dmg-${{ needs.build.outputs.tag }}
          path: |
            dist/LiveCaptions-${{ needs.build.outputs.version }}-mac-arm64.dmg
            dist/LiveCaptions-${{ needs.build.outputs.version }}-mac-arm64.dmg.sha256
            dist/LiveCaptions-${{ needs.build.outputs.version }}.zip
            dist/LiveCaptions-${{ needs.build.outputs.version }}.zip.sha256
            dist/dmg-notary-id.txt
          if-no-files-found: error
          retention-days: 14

      - name: Install the signed zip and write release notes
        timeout-minutes: 5
        run: |
          set -euo pipefail
          scripts/install-selftest.sh "$VERSION" dist
          cp scripts/install.sh dist/install.sh
          RELEASE_SIGNED=1 scripts/release-notes.sh "$VERSION" \
            "dist/LiveCaptions-$VERSION.zip.sha256" \
            "dist/LiveCaptions-$VERSION-mac-arm64.dmg.sha256" >dist/release-notes.md
          cat dist/release-notes.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload signed release files
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: |
            dist/LiveCaptions-${{ needs.build.outputs.version }}-mac-arm64.dmg
            dist/LiveCaptions-${{ needs.build.outputs.version }}-mac-arm64.dmg.sha256
            dist/LiveCaptions-${{ needs.build.outputs.version }}.zip
            dist/LiveCaptions-${{ needs.build.outputs.version }}.zip.sha256
            dist/install.sh
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [build, sign]
    # Only a pushed tag with verified notarized artifacts publishes.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: dist

      - name: Check the files and the checksum
        env:
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: dist
        run: |
          set -euo pipefail
          zip="LiveCaptions-$VERSION.zip"
          dmg="LiveCaptions-$VERSION-mac-arm64.dmg"
          for f in "$dmg" "$dmg.sha256" "$zip" "$zip.sha256" install.sh release-notes.md; do
            [[ -s "$f" ]] || { echo "error: missing or empty $f" >&2; exit 1; }
          done
          sha256sum -c "$dmg.sha256"
          sha256sum -c "$zip.sha256"
          first_line="$(head -n 1 install.sh)"
          [[ "$first_line" == '#!/bin/bash' ]] || { echo "error: install.sh is not the installer" >&2; exit 1; }
          # A UDIF disk image ends with a 512-byte trailer starting "koly".
          [[ "$(tail -c 512 "$dmg" | head -c 4)" == koly ]] || { echo "error: $dmg is not a UDIF disk image" >&2; exit 1; }

      # Fails if a Release for this tag already exists (no silent overwrite)
      # and, with --verify-tag, if the tag is not on GitHub.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: dist
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "LiveCaptions $VERSION" \
            --notes-file release-notes.md \
            "LiveCaptions-$VERSION-mac-arm64.dmg" \
            "LiveCaptions-$VERSION-mac-arm64.dmg.sha256" \
            "LiveCaptions-$VERSION.zip" \
            "LiveCaptions-$VERSION.zip.sha256" \
            install.sh
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '.url, (.assets[] | "\(.name) \(.size)")'
