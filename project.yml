# XcodeGen spec. The .xcodeproj is generated (`make generate`) and not committed.
name: LiveCaptions

options:
  bundleIdPrefix: dev.trine
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing: builds anywhere (CI included) without an Apple team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

packages:
  Core:
    path: Packages/Core
  SpeechAdapter:
    path: Packages/SpeechAdapter
  AudioAdapter:
    path: Packages/AudioAdapter

targets:
  LiveCaptions:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
    dependencies:
      - package: Core
        product: LiveCaptionsCore
      - package: SpeechAdapter
        product: LiveCaptionsSpeech
      - package: AudioAdapter
        product: LiveCaptionsAudio
    settings:
      base:
        PRODUCT_NAME: LiveCaptions
        PRODUCT_BUNDLE_IDENTIFIER: dev.trine.LiveCaptions
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/LiveCaptions.entitlements
        ENABLE_APP_SANDBOX: NO
    scheme: {}
