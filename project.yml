# XcodeGen spec. The .xcodeproj is generated (`make generate`) and not committed.
name: LiveCaptions

options:
  bundleIdPrefix: dev.trine
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    # Ad-hoc signing: builds anywhere (CI included) without an Apple team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    # Release is what CI packages and the owner installs (docs/DECISIONS.md 0004).
    Release:
      # With CODE_SIGN_IDENTITY "-" Xcode signs "to run locally" and injects
      # com.apple.security.get-task-allow, which lets any same-user process
      # attach a debugger and read memory, and which notarization rejects.
      # Debug keeps the default (YES) so local builds stay debuggable.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      # Strip the shipped binary during `xcodebuild build` (not only on
      # install/archive): no symbol table, no debug map with runner paths.
      # Debug info goes to the dSYM next to the app instead.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      COPY_PHASE_STRIP: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  Core:
    path: Packages/Core
  SpeechAdapter:
    path: Packages/SpeechAdapter
  AudioAdapter:
    path: Packages/AudioAdapter

targets:
  LiveCaptions:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
    dependencies:
      - package: Core
        product: LiveCaptionsCore
      - package: SpeechAdapter
        product: LiveCaptionsSpeech
      - package: AudioAdapter
        product: LiveCaptionsAudio
    settings:
      base:
        PRODUCT_NAME: LiveCaptions
        PRODUCT_BUNDLE_IDENTIFIER: dev.trine.LiveCaptions
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/LiveCaptions.entitlements
        ENABLE_APP_SANDBOX: NO
    scheme: {}
